name = "formal-check-1"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["FormalCheck1", "Main"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "FormalCheck1"

[[lean_lib]]
name = "Main"
